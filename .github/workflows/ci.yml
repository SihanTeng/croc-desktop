name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go — lint, vet, fmt, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # frontend/dist is embedded by the Go module (go:embed all:frontend/dist)
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      # Wails v3 Linux defaults to gtk4/webkitgtk6; this project targets the
      # gtk3/webkit2gtk 4.1 stack (EXTRA_TAGS=gtk3) for broader distro support.
      - name: Install webview deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: golangci-lint
        # built from source with the runner's Go so its language version
        # always matches go.mod (prebuilt binaries lag behind)
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run --build-tags gtk3 ./...

      - name: gofmt check
        run: |
          files=$(find . -name '*.go' \
            -not -path './frontend/node_modules/*' \
            -not -path './e2e/node_modules/*' \
            -not -path './bin/*')
          test -z "$(gofmt -l $files)" || { gofmt -l $files; exit 1; }

      - name: go vet
        run: go vet -tags gtk3 ./...

      - name: go test
        run: go test -tags gtk3 -timeout 300s ./...

  frontend:
    name: Frontend — format, lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: prettier
        working-directory: frontend
        run: npm run format:check

      - name: eslint
        working-directory: frontend
        run: npm run lint

      - name: tsc
        working-directory: frontend
        run: npm run typecheck

      - name: vitest
        working-directory: frontend
        run: npm run test

      - name: vite build
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E — browser-driven transfers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails v3 CLI
        run: go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.119

      - name: Install webview and display deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium

      # run.sh boots a sandboxed app (local relay + isolated config) when no
      # dev server is running, which is always the case in CI
      - name: Run E2E suite
        run: ./e2e/run.sh
