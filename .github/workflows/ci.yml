name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go — lint, vet, fmt, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # frontend/dist is embedded by the Go module (go:embed all:frontend/dist)
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: golangci-lint
        # built from source with the runner's Go so its language version
        # always matches go.mod (prebuilt binaries lag behind)
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run ./...

      - name: gofmt check
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -timeout 300s ./...

  frontend:
    name: Frontend — format, lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: prettier
        working-directory: frontend
        run: npm run format:check

      - name: eslint
        working-directory: frontend
        run: npm run lint

      - name: tsc
        working-directory: frontend
        run: npm run typecheck

      - name: vite build
        working-directory: frontend
        run: npm run build
