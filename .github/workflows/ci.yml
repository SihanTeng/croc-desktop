name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go — lint, vet, fmt, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify pinned croc source and desktop patch
        run: python3 scripts/check-croc-source.py

      - name: Upstream receive and security regressions
        working-directory: third_party/croc
        run: |
          go test -timeout 180s ./src/receivefs ./src/pakekey ./src/codephrase
          go test -timeout 180s ./src/croc -run 'Test(Desktop|SendingText|ReceiveOverwrite|SizeZero|IncomingSymlink|NewSizeZero|ReceiveStdin|ReceiveTextArtifact|Declined|Stdout|Hostile|Marked|Unmarked|RejectsUnsupportedPeer|FailedPake|NewCtxCancellation|ReceiveCancellation)'

      - name: Install unmodified croc CLI for interoperability tests
        env:
          GOBIN: ${{ runner.temp }}/croc-upstream
        run: go install github.com/schollz/croc/v11@v11.5.4

      # frontend/dist is embedded by the Go module (go:embed all:frontend/dist)
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      # Wails v3 Linux defaults to gtk4/webkitgtk6; this project targets the
      # gtk3/webkit2gtk 4.1 stack (EXTRA_TAGS=gtk3) for broader distro support.
      - name: Install webview deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: golangci-lint
        # Pin the supported major and build with the runner's Go toolchain.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          golangci-lint run --build-tags gtk3 ./...
          golangci-lint fmt --diff

      # Keep checksum-pinned upstream formatting intact; provenance is checked above.
      - name: gofmt check
        run: |
          mapfile -d '' -t files < <(find . -name '*.go' \
            -not -path './frontend/node_modules/*' \
            -not -path './e2e/node_modules/*' \
            -not -path './bin/*' \
            -not -path './third_party/*' -print0)
          unformatted=$(gofmt -l "${files[@]}")
          test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }

      - name: go vet
        run: go vet -tags gtk3 ./...

      - name: go test
        env:
          CROC_TEST_CLI: ${{ runner.temp }}/croc-upstream/croc
        run: go test -tags gtk3 -timeout 300s ./...

      - name: Race detector
        run: go test -race -tags server -timeout 300s .

  frontend:
    name: Frontend — format, lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: prettier
        working-directory: frontend
        run: npm run format:check

      - name: eslint
        working-directory: frontend
        run: npm run lint

      - name: tsc
        working-directory: frontend
        run: npm run typecheck

      - name: vitest
        working-directory: frontend
        run: npm run test

      - name: vite build
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E — browser-driven transfers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium

      # run.sh boots a sandboxed app in Wails v3 server mode (-tags server,
      # CGO off): headless HTTP+WS, so no wails3 CLI, gtk/webkit, or xvfb
      - name: Run E2E suite
        run: ./e2e/run.sh
