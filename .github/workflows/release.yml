name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
            platform: linux/amd64
            bin: croc-desktop
            artifact: croc-desktop_${{ github.ref_name }}_linux-amd64.AppImage
          - os: macos-latest
            name: darwin-arm64
            platform: darwin/arm64
            bin: croc-desktop
            artifact: croc-desktop_${{ github.ref_name }}_darwin-arm64.dmg
          - os: windows-latest
            name: windows-amd64
            platform: windows/amd64
            bin: croc-desktop.exe
            artifact: croc-desktop_${{ github.ref_name }}_windows-amd64.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails v3 CLI
        # gtk3 tag: CLI itself links webkit; needed on Linux runners without gtk4
        run: go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.119

      - name: Install Linux webview deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev imagemagick

      # Wails v3 builds for the host OS via Taskfile; matrix runners are
      # native (ubuntu → linux, macos → darwin, windows → windows).
      # Linux uses EXTRA_TAGS=gtk3 (webkit2gtk 4.1) so CI doesn't need gtk4.
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: wails3 build -tags gtk3
        env:
          EXTRA_TAGS: gtk3

      - name: Build (macOS / Windows)
        if: runner.os != 'Linux'
        run: wails3 build

      # ---------- Linux: AppImage ----------

      - name: Fetch linuxdeploy
        if: runner.os == 'Linux'
        run: |
          curl -Lo linuxdeploy.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage

      - name: Package AppImage
        if: runner.os == 'Linux'
        run: |
          mkdir -p AppDir/usr/bin
          # v3 places host builds in bin/ (Taskfile BIN_DIR)
          cp bin/croc-desktop AppDir/usr/bin/
          # linuxdeploy only accepts standard icon resolutions (max 512px)
          # and deploys the icon by basename, which must match Icon=croc-desktop
          convert build/appicon.png -resize 512x512 /tmp/croc-desktop.png
          # linuxdeploy names the AppImage after the desktop file's Name;
          # OUTPUT pins the final artifact name instead
          OUTPUT=${{ matrix.artifact }} ./linuxdeploy.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            -e AppDir/usr/bin/croc-desktop \
            -d packaging/linux/croc-desktop.desktop \
            -i /tmp/croc-desktop.png \
            --output appimage

      # ---------- macOS: DMG ----------

      - name: Ad-hoc sign and package DMG
        if: runner.os == 'macOS'
        run: |
          # wails3 package lays out a .app under bin/; fall back to a bare binary
          APP_PATH="bin/croc-desktop.app"
          if [ ! -d "$APP_PATH" ]; then
            wails3 package
          fi
          if [ -d "$APP_PATH" ]; then
            codesign --deep --force --sign - "$APP_PATH"
            mkdir -p dmg
            cp -R "$APP_PATH" dmg/
          else
            mkdir -p dmg
            cp bin/croc-desktop dmg/
          fi
          hdiutil create -volname croc -srcfolder dmg -ov -format UDZO ${{ matrix.artifact }}

      # ---------- Windows: MSI ----------

      - name: Install WiX
        if: runner.os == 'Windows'
        run: choco install wixtoolset --no-progress -y

      - name: Package MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # the choco package installs the latest v3.x; resolve whatever
          # version landed rather than hardcoding v3.11
          $wix = (Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin" -Directory | Select-Object -First 1).FullName
          & "$wix\candle.exe" packaging\windows\Product.wxs -out Product.wixobj
          & "$wix\light.exe" Product.wixobj -ext WixUIExtension -sice:ICE64 -out ${{ matrix.artifact }}

      # ---------- publish ----------

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Downloads

            | Platform | File |
            | --- | --- |
            | Linux (AppImage) | `croc-desktop_${{ github.ref_name }}_linux-amd64.AppImage` |
            | macOS (Apple Silicon) | `croc-desktop_${{ github.ref_name }}_darwin-arm64.dmg` |
            | Windows (MSI) | `croc-desktop_${{ github.ref_name }}_windows-amd64.msi` |
