name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
            platform: linux/amd64
          - os: macos-latest
            name: darwin-arm64
            platform: darwin/arm64
          - os: windows-latest
            name: windows-amd64
            platform: windows/amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install Linux webview deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build
        run: wails build -platform ${{ matrix.platform }} -tags webkit2_41 -o croc-gui

      # ---------- Linux: AppImage ----------

      - name: Fetch linuxdeploy
        if: runner.os == 'Linux'
        run: |
          curl -Lo linuxdeploy.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage

      - name: Package AppImage
        if: runner.os == 'Linux'
        run: |
          mkdir -p AppDir/usr/bin
          cp build/bin/croc-gui AppDir/usr/bin/
          ./linuxdeploy.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            -e AppDir/usr/bin/croc-gui \
            -d packaging/linux/croc-gui.desktop \
            -i build/appicon.png \
            --output appimage
          mv croc-gui-x86_64.AppImage croc-gui_linux_amd64.AppImage

      # ---------- macOS: DMG ----------

      - name: Ad-hoc sign and package DMG
        if: runner.os == 'macOS'
        run: |
          cd build/bin
          codesign --deep --force --sign - croc-gui.app
          mkdir -p dmg
          cp -R croc-gui.app dmg/
          hdiutil create -volname croc -srcfolder dmg -ov -format UDZO ../../croc-gui_darwin_arm64.dmg

      # ---------- Windows: MSI ----------

      - name: Install WiX
        if: runner.os == 'Windows'
        run: choco install wixtoolset --no-progress -y

      - name: Package MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wix = "${env:ProgramFiles(x86)}\WiX Toolset v3.11\bin"
          & "$wix\candle.exe" packaging\windows\Product.wxs -out Product.wixobj
          & "$wix\light.exe" Product.wixobj -ext WixUIExtension -out croc-gui_windows_amd64.msi

      # ---------- publish ----------

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: croc-gui_${{ matrix.name }}.*
          fail_on_unmatched_files: true
