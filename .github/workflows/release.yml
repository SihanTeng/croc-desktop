name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# The git tag is the single source of truth for the version. The Taskfiles
# inject it into the binary (-X main.AppVersion) and the macOS bundle plist;
# the Windows step below stamps it into info.json and the WiX manifest.
# Empty on non-tag runs (workflow_dispatch), where builds fall back to the
# latest reachable git tag.
env:
  APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
            platform: linux/amd64
            bin: croc-desktop
            artifact: croc-desktop_${{ github.ref_name }}_linux-amd64.AppImage
          - os: macos-latest
            name: darwin-arm64
            platform: darwin/arm64
            bin: croc-desktop
            artifact: croc-desktop_${{ github.ref_name }}_darwin-arm64.dmg
          - os: windows-latest
            name: windows-amd64
            platform: windows/amd64
            bin: croc-desktop.exe
            artifact: croc-desktop_${{ github.ref_name }}_windows-amd64.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `git describe` (Taskfile version fallback) works.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux webview deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev imagemagick

      - name: Install Wails v3 CLI
        # gtk3 tag: CLI itself links webkit; needed on Linux runners without gtk4.
        # Must run after the webview deps: -tags gtk3 shells out to pkg-config.
        run: go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.119

      - name: Stamp version into Windows resources
        # exe file properties (info.json → syso) and the MSI (Product.wxs) get
        # the tag version; keyed regexes so no repo file needs manual bumping.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v',''
          if ($v -notmatch '^\d+\.\d+\.\d+$') { $v = '0.0.0' }
          $ij = Get-Content build/windows/info.json -Raw
          $ij = $ij -replace '"file_version": "[^"]*"', ('"file_version": "' + $v + '"')
          $ij = $ij -replace '"ProductVersion": "[^"]*"', ('"ProductVersion": "' + $v + '"')
          Set-Content build/windows/info.json $ij
          $wxs = Get-Content packaging/windows/Product.wxs -Raw
          $wxs = $wxs -replace 'Version="[0-9.]+"', ('Version="' + $v + '.0"')
          Set-Content packaging/windows/Product.wxs $wxs

      # Wails v3 builds for the host OS via Taskfile; matrix runners are
      # native (ubuntu → linux, macos → darwin, windows → windows).
      # Linux uses EXTRA_TAGS=gtk3 (webkit2gtk 4.1) so CI doesn't need gtk4.
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: wails3 build -tags gtk3
        env:
          EXTRA_TAGS: gtk3

      - name: Build (macOS / Windows)
        if: runner.os != 'Linux'
        run: wails3 build

      # ---------- Linux: AppImage ----------

      - name: Fetch linuxdeploy
        if: runner.os == 'Linux'
        run: |
          curl -Lo linuxdeploy.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage

      - name: Package AppImage
        if: runner.os == 'Linux'
        run: |
          mkdir -p AppDir/usr/bin
          # v3 places host builds in bin/ (Taskfile BIN_DIR)
          cp bin/croc-desktop AppDir/usr/bin/
          # linuxdeploy only accepts standard icon resolutions (max 512px)
          # and deploys the icon by basename, which must match Icon=croc-desktop
          convert build/appicon.png -resize 512x512 /tmp/croc-desktop.png
          # linuxdeploy names the AppImage after the desktop file's Name;
          # OUTPUT pins the final artifact name instead
          OUTPUT=${{ matrix.artifact }} ./linuxdeploy.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            -e AppDir/usr/bin/croc-desktop \
            -d packaging/linux/croc-desktop.desktop \
            -i /tmp/croc-desktop.png \
            --output appimage

      # ---------- macOS: DMG ----------

      - name: Ad-hoc sign and package DMG
        if: runner.os == 'macOS'
        run: |
          # wails3 package lays out a .app under bin/; fall back to a bare binary
          APP_PATH="bin/croc-desktop.app"
          if [ ! -d "$APP_PATH" ]; then
            wails3 package
          fi
          if [ -d "$APP_PATH" ]; then
            codesign --deep --force --sign - "$APP_PATH"
            mkdir -p dmg
            cp -R "$APP_PATH" dmg/
          else
            mkdir -p dmg
            cp bin/croc-desktop dmg/
          fi
          hdiutil create -volname croc -srcfolder dmg -ov -format UDZO ${{ matrix.artifact }}

      # ---------- Windows: MSI ----------

      - name: Install WiX
        if: runner.os == 'Windows'
        run: choco install wixtoolset --no-progress -y

      - name: Package MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # the choco package installs the latest v3.x; resolve whatever
          # version landed rather than hardcoding v3.11
          $wix = (Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin" -Directory | Select-Object -First 1).FullName
          & "$wix\candle.exe" packaging\windows\Product.wxs -out Product.wixobj
          & "$wix\light.exe" Product.wixobj -ext WixUIExtension -sice:ICE64 -out ${{ matrix.artifact }}

      # ---------- publish ----------

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Downloads

            | Platform | File |
            | --- | --- |
            | Linux (AppImage) | `croc-desktop_${{ github.ref_name }}_linux-amd64.AppImage` |
            | macOS (Apple Silicon) | `croc-desktop_${{ github.ref_name }}_darwin-arm64.dmg` |
            | Windows (MSI) | `croc-desktop_${{ github.ref_name }}_windows-amd64.msi` |

  # Pushes the freshly built DMG's version+sha256 into SihanTeng/homebrew-tap.
  # Kage-style self-disable: with no HOMEBREW_TAP_GITHUB_TOKEN secret the job
  # is a no-op and the release still succeeds; the channel lights up the
  # moment the secret exists (fine-grained PAT, contents:write on the tap).
  publish-homebrew:
    name: Publish Homebrew cask
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip notice
        if: env.TAP_GITHUB_TOKEN == ''
        run: echo "::notice::HOMEBREW_TAP_GITHUB_TOKEN not set — Homebrew cask not updated."

      - name: Update Homebrew tap
        if: env.TAP_GITHUB_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" \
            --repo SihanTeng/croc-desktop \
            --pattern "*darwin-arm64.dmg" --dir /tmp/release \
            --clobber
          sha=$(shasum -a 256 /tmp/release/*.dmg | cut -d' ' -f1)
          sed -e "s/{{VERSION}}/$version/g" -e "s/{{SHA256}}/$sha/g" \
            packaging/homebrew/croc-desktop.rb.tpl > /tmp/croc-desktop.rb
          git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/SihanTeng/homebrew-tap.git" /tmp/tap
          cp /tmp/croc-desktop.rb /tmp/tap/Casks/croc-desktop.rb
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/croc-desktop.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date."
            exit 0
          fi
          git commit -m "croc-desktop $version"
          git push
