version: "2"
run:
  timeout: 5m
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  exclusions:
    generated: lax
    rules:
      - linters:
          - unused
        path: _test\.go
    paths:
      - ^third_party/
      - (^|/)node_modules/
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - ^third_party/
      - (^|/)node_modules/
      - builtin$
      - examples$
