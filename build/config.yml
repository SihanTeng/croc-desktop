# Wails v3 project configuration for croc-desktop.
# When you update `info` or `fileAssociations`, run
# `wails3 task common:update:build-assets` to update the assets.
version: '3'

info:
  companyName: "SihanTeng"
  productName: "croc-desktop"
  productIdentifier: "io.github.sihanteng.croc-desktop"
  description: "GUI for croc — encrypted peer-to-peer file transfer"
  copyright: "© 2026 SihanTeng"
  comments: "croc-desktop"
  version: "0.2.0"

# iOS (used by wails3 task ios:* / ios:xcode)
ios:
  bundleID: "io.github.sihanteng.croc-desktop"
  displayName: "croc-desktop"
  version: "0.2.0"
  minIOSVersion: "15.0"
  company: "SihanTeng"
  comments: "croc mobile"

# Android package id (wails3 task android:*)
# APP_ID can also be overridden on the command line.
# android app id defaults to productIdentifier when unset.

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - e2e
      - docs
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build -tags gtk3 DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run EXTRA_TAGS=gtk3
      type: primary

fileAssociations: []

other: []
